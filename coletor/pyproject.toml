[project]
name = "coletor"
version = "0.0.1"
description = "Coletor de RUM"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.116.1",
    "orjson>=3.11.3",
    "pydantic-settings>=2.10.1",
    "sqlalchemy>=2.0.43",
    "toml>=0.10.2",
    "opentelemetry-distro>=0.55b1",
    "opentelemetry-exporter-otlp>=1.34.1",
    "influxdb3-python>=0.16.0",
    "pandas>=2.3.3",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "blue>=0.9.1",
]
